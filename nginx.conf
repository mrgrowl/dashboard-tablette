server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relais calendrier (contourne l'absence de CORS sur les flux ICS Google).
    # "calendar-relay" est le nom du service dans docker-compose.yml, résolu
    # via le réseau Docker interne.
    location /api/ {
        proxy_pass http://calendar-relay:3002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
